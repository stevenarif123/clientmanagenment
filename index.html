<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientHub - Client &amp; Project Management</title>

  <!-- Inter Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#0f172a'
            }
          }
        }
      }
    }
  </script>

  <!-- Application Custom Styles -->
  <link rel="stylesheet" href="assets/css/app.css">

  <!-- Vue 3, Axios, Chart.js & SortableJS CDNs -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body class="h-full antialiased text-slate-900">
  <div id="app" v-cloak class="h-full">
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

    <!-- Initial Bootstrapping Loader -->
    <div v-if="appLoading" class="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
      <div class="w-11 h-11 rounded-xl bg-slate-900 text-white flex items-center justify-center mb-4 shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
      </div>
      <div class="spinner spinner-lg text-slate-900"></div>
      <p class="text-sm font-semibold text-slate-600 mt-4 tracking-tight">Initializing ClientHub...</p>
    </div>

    <!-- Guest Screens (Login, Setup, or Not Authenticated) -->
    <template v-else-if="!auth.isAuthenticated || isGuestScreen">
      <component :is="guestComponent" />
    </template>

    <!-- Authenticated App Shell -->
    <template v-else>
      <app-layout :current-route="currentRoute">
        <component :is="matchedRoute.component" v-bind="matchedRoute.props" :key="matchedRoute.key" />
      </app-layout>
    </template>
  </div>

  <!-- Core Libraries & Data Stores -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>

  <!-- Components -->
  <script src="js/components/stats-card.js"></script>
  <script src="js/components/modals.js"></script>
  <script src="js/components/layout.js"></script>

  <!-- Pages -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/clients.js"></script>
  <script src="js/pages/projects.js"></script>
  <script src="js/pages/submissions.js"></script>
  <script src="js/pages/services.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/kanban.js"></script>

  <!-- Application Bootstrap & Routing Logic -->
  <script>
    const { createApp } = Vue;

    const app = createApp({
      components: {
        AppLayout: window.AppLayout
      },
      data() {
        return {
          appLoading: true,
          auth: window.Auth,
          currentRoute: window.location.hash || '#/'
        };
      },
      computed: {
        currentHashPath() {
          return (this.currentRoute || '#/').split('?')[0];
        },
        isGuestScreen() {
          return this.currentHashPath === '#/login' || this.currentHashPath === '#/setup';
        },
        guestComponent() {
          if (this.currentHashPath === '#/setup' || window.Auth.needsSetup) {
            return window.SetupView;
          }
          return window.LoginView;
        },
        matchedRoute() {
          const hash = this.currentHashPath;

          if (hash === '#/login') return { component: window.LoginView, props: {}, key: 'login' };
          if (hash === '#/setup') return { component: window.SetupView, props: {}, key: 'setup' };
          if (hash === '#/' || hash === '' || hash === '#') {
            return { component: window.DashboardView, props: {}, key: 'dashboard' };
          }

          // Clients Routes
          if (hash === '#/clients') return { component: window.ClientsView, props: {}, key: 'clients' };
          if (hash === '#/clients/new') {
            return { component: window.ClientFormView, props: { id: null }, key: 'client-new' };
          }
          const clientEditMatch = hash.match(/^#\/clients\/(\d+)\/edit$/);
          if (clientEditMatch) {
            const id = parseInt(clientEditMatch[1], 10);
            return { component: window.ClientFormView, props: { id }, key: `client-edit-${id}` };
          }
          const clientDetailMatch = hash.match(/^#\/clients\/(\d+)$/);
          if (clientDetailMatch) {
            const id = parseInt(clientDetailMatch[1], 10);
            return { component: window.ClientDetailView, props: { id }, key: `client-detail-${id}` };
          }

          // Projects Routes
          if (hash === '#/projects') return { component: window.ProjectsView, props: {}, key: 'projects' };
          if (hash === '#/projects/new') {
            return { component: window.ProjectFormView, props: { id: null }, key: 'project-new' };
          }
          const projectEditMatch = hash.match(/^#\/projects\/(\d+)\/edit$/);
          if (projectEditMatch) {
            const id = parseInt(projectEditMatch[1], 10);
            return { component: window.ProjectFormView, props: { id }, key: `project-edit-${id}` };
          }
          const projectDetailMatch = hash.match(/^#\/projects\/(\d+)$/);
          if (projectDetailMatch) {
            const id = parseInt(projectDetailMatch[1], 10);
            return { component: window.ProjectDetailView, props: { id }, key: `project-detail-${id}` };
          }

          // Task Board Route
          if (hash === '#/tasks') return { component: window.KanbanBoardView, props: {}, key: 'tasks' };

          // Other Routes
          if (hash === '#/submissions') return { component: window.SubmissionsView, props: {}, key: 'submissions' };
          if (hash === '#/services') return { component: window.ServicesView, props: {}, key: 'services' };
          if (hash === '#/reports') return { component: window.ReportsView, props: {}, key: 'reports' };

          return { component: window.DashboardView, props: {}, key: 'dashboard-fallback' };
        }
      },
      async mounted() {
        window.addEventListener('hashchange', () => {
          this.currentRoute = window.location.hash || '#/';
          this.routeGuard();
        });

        await this.initApp();
      },
      methods: {
        async initApp() {
          this.appLoading = true;

          const needsSetup = await window.Auth.checkSetup();
          if (needsSetup) {
            this.currentRoute = '#/setup';
            window.location.hash = '#/setup';
            this.appLoading = false;
            return;
          }

          if (window.Auth.token) {
            await window.Auth.checkAuth();
          }

          if (!window.Auth.isAuthenticated) {
            this.currentRoute = '#/login';
            if (this.currentHashPath !== '#/login') {
              window.location.hash = '#/login';
            }
          } else {
            this.currentRoute = window.location.hash || '#/';
            if (this.currentHashPath === '#/login' || this.currentHashPath === '#/setup') {
              this.currentRoute = '#/';
              window.location.hash = '#/';
            }
          }

          this.appLoading = false;
        },
        routeGuard() {
          const hash = this.currentHashPath;

          if (window.Auth.needsSetup) {
            if (hash !== '#/setup') {
              this.currentRoute = '#/setup';
              window.location.hash = '#/setup';
            }
            return;
          }

          if (!window.Auth.isAuthenticated) {
            if (hash !== '#/login' && hash !== '#/setup') {
              this.currentRoute = '#/login';
              window.location.hash = '#/login';
            }
            return;
          }

          if (window.Auth.isAuthenticated && (hash === '#/login' || hash === '#/setup')) {
            this.currentRoute = '#/';
            window.location.hash = '#/';
          }
        }
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
