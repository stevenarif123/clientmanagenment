<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami / Konsultasi Proyek - ClientHub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-indigo-50/40 text-slate-800 p-4 sm:p-8 flex items-center justify-center min-h-screen antialiased">
  <div class="max-w-lg w-full bg-white rounded-2xl border border-slate-200/80 shadow-xl p-6 sm:p-8">
    <div class="text-center mb-6">
      <div class="w-11 h-11 rounded-xl bg-slate-900 text-white flex items-center justify-center mx-auto mb-3 shadow-sm font-bold text-sm">
        CH
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Konsultasi Proyek</h1>
      <p class="text-sm text-slate-500 mt-1">Ceritakan kebutuhan website atau software Anda, tim kami akan segera merespons.</p>
    </div>

    <div id="alert" class="hidden mb-5 p-3.5 rounded-xl text-sm font-medium"></div>

    <form id="contactForm" class="space-y-4">
      <div>
        <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Nama Lengkap *</label>
        <input
          type="text"
          id="name"
          required
          placeholder="Contoh: Budi Santoso"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-slate-900"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Email *</label>
          <input
            type="email"
            id="email"
            required
            placeholder="budi@example.com"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-slate-900"
          />
        </div>
        <div>
          <label for="phone" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">No. WhatsApp</label>
          <input
            type="tel"
            id="phone"
            placeholder="08123456789"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-slate-900"
          />
        </div>
      </div>

      <div>
        <label for="service_id" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Pilihan Layanan</label>
        <select
          id="service_id"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-slate-900"
        >
          <option value="">-- Pilih Layanan --</option>
        </select>
      </div>

      <div>
        <label for="message" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Pesan / Kebutuhan Proyek *</label>
        <textarea
          id="message"
          rows="4"
          required
          placeholder="Jelaskan gambaran singkat website yang ingin dibuat, fitur utama, target selesai, dll."
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-slate-900"
        ></textarea>
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full py-3 bg-slate-900 hover:bg-slate-800 disabled:opacity-60 text-white font-semibold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
      >
        <span>Kirim Pesan Konsultasi &rarr;</span>
      </button>
    </form>
  </div>

  <script>
    const apiBase = window.location.pathname.replace(/\/public-contact-form\.html$/i, '').replace(/\/+$/, '') + '/api';

    // Load available services dynamically
    fetch(`${apiBase}/services`)
      .then(res => res.json())
      .then(data => {
        if (data.data) {
          const select = document.getElementById('service_id');
          data.data.filter(s => s.is_active).forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            select.appendChild(opt);
          });
        }
      })
      .catch(() => {});

    // Handle Form Submit
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alert');

      btn.disabled = true;
      btn.textContent = 'Mengirim...';
      alertBox.className = 'hidden';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        service_id: document.getElementById('service_id').value ? parseInt(document.getElementById('service_id').value, 10) : null,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch(`${apiBase}/submissions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (response.ok) {
          alertBox.className = 'mb-5 p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-sm font-medium';
          alertBox.textContent = 'Pesan Anda berhasil terkirim! Tim kami akan segera menghubungi Anda.';
          document.getElementById('contactForm').reset();
        } else {
          const firstFieldErr = result.errors ? Object.values(result.errors)[0] : '';
          alertBox.className = 'mb-5 p-3.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl text-sm font-medium';
          alertBox.textContent = firstFieldErr || result.message || 'Terjadi kendala saat mengirim pesan.';
        }
      } catch (err) {
        alertBox.className = 'mb-5 p-3.5 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl text-sm font-medium';
        alertBox.textContent = 'Gagal terhubung ke server.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim Pesan Konsultasi \u2192';
      }
    });
  </script>
</body>
</html>
