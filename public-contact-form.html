<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami / Konsultasi Proyek</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-8 flex items-center justify-center min-h-screen">
  <div class="max-w-lg w-full bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Konsultasi Proyek</h2>
      <p class="text-sm text-slate-500 mt-1">Ceritakan kebutuhan website atau software Anda, kami akan segera merespons.</p>
    </div>

    <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <form id="contactForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Nama Lengkap *</label>
        <input
          type="text"
          id="name"
          required
          placeholder="Contoh: Budi Santoso"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Email *</label>
          <input
            type="email"
            id="email"
            required
            placeholder="budi@example.com"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">No. WhatsApp</label>
          <input
            type="tel"
            id="phone"
            placeholder="08123456789"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900"
          />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Pilihan Layanan</label>
        <select
          id="service_id"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900"
        >
          <option value="">-- Pilih Layanan --</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Pesan / Kebutuhan Proyek *</label>
        <textarea
          id="message"
          rows="4"
          required
          placeholder="Jelaskan gambaran singkat website yang ingin dibuat, fitur utama, target selesai, dll."
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/20 focus:border-slate-900"
        ></textarea>
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm rounded-lg shadow-md transition-all flex items-center justify-center gap-2"
      >
        <span>Kirim Pesan Konsultasi &rarr;</span>
      </button>
    </form>
  </div>

  <script>
    // Load available services
    fetch('/api/services')
      .then(res => res.json())
      .then(data => {
        if (data.data) {
          const select = document.getElementById('service_id');
          data.data.filter(s => s.is_active).forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            select.appendChild(opt);
          });
        }
      })
      .catch(() => {});

    // Handle Form Submit
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alert');

      btn.disabled = true;
      btn.textContent = 'Mengirim...';
      alertBox.className = 'hidden';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        service_id: document.getElementById('service_id').value ? parseInt(document.getElementById('service_id').value) : null,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (response.ok) {
          alertBox.className = 'mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-sm';
          alertBox.textContent = '✅ Pesan Anda berhasil terkirim! Tim kami akan segera menghubungi Anda.';
          document.getElementById('contactForm').reset();
        } else {
          alertBox.className = 'mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-sm';
          alertBox.textContent = result.message || 'Terjadi kendala saat mengirim pesan.';
        }
      } catch (err) {
        alertBox.className = 'mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-sm';
        alertBox.textContent = 'Gagal terhubung ke server.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim Pesan Konsultasi →';
      }
    });
  </script>
</body>
</html>
